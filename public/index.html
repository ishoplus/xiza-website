*{box-sizing:border-box;margin:0;padding:0}
:root{--wall:#f6efe4;--ink:#3a2e27;--soft:#8a7a6e;--navy:#141b33}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--wall);-webkit-font-smoothing:antialiased}

/* 首屏＝牠們的房間：牆上掛本人的照片，地板上是遊戲裡的牠們 */
.room{position:relative;height:94vh;min-height:620px;overflow:hidden;user-select:none;-webkit-user-select:none}
.wall{position:absolute;inset:0 0 34% 0;background:repeating-linear-gradient(90deg,#f6efe4 0 46px,#f2e9dc 46px 48px)}
.floor{position:absolute;inset:66% 0 0 0;background:linear-gradient(#e7cfae,#d9bb93);box-shadow:inset 0 6px 0 #c9a77d}
.floor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 158px,#c9a77d55 158px 160px)}

.logo{position:absolute;top:22px;left:5vw;z-index:5}
.logo img{width:32px;height:32px;border-radius:9px;display:block}

.sign{position:absolute;left:50%;top:9%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:20px;z-index:3}
.sign .name{display:flex;align-items:center;gap:14px}
.sign .name img{width:60px;height:60px;border-radius:50%}
.sign .name b{white-space:nowrap;font-family:"Songti TC","Noto Serif TC",serif;font-size:clamp(34px,4.4vw,52px);font-weight:900;letter-spacing:.08em}
.btn{display:inline-block;padding:17px 42px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 10px 24px #3a2e2733;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}

/* 進遊戲：跟遊戲同一套手繪肉球圖示（icons.js 的 paw），不放字；每隔幾秒輕輕按一下 */
.go{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 12px 28px #5a3a2230,0 0 0 6px #ffffff88;transition:transform .2s;animation:press 3.2s ease-in-out infinite}
.go svg{width:56px;height:56px}
.go:hover{transform:scale(1.06);animation:none}
@keyframes press{0%,78%,100%{transform:scale(1)}84%{transform:scale(.9)}90%{transform:scale(1.04)}}
/* 牆上的照片 */
.frame{position:absolute;background:#fff;padding:8px;box-shadow:0 10px 24px #5a3a2226;border-radius:3px}
.frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.frame::before{content:"";position:absolute;left:50%;top:-16px;width:2px;height:16px;background:#b79c80}
.f1{left:7%;top:13%;width:150px;transform:rotate(-4deg)}
.f2{right:8%;top:10%;width:160px;transform:rotate(3deg)}
.f3{right:21%;top:30%;width:120px;transform:rotate(-2deg)}

/* 地板上的貓 */
.cat{position:absolute;left:0;bottom:0;transform-origin:50% 100%;cursor:pointer;will-change:transform}
.cat img{display:block;pointer-events:none;filter:drop-shadow(0 4px 3px #5a3a2230)}
.cat .shadow{position:absolute;left:18%;right:18%;bottom:-6px;height:12px;border-radius:50%;background:#5a3a2222;z-index:-1}
.heart{position:absolute;width:22px;height:22px;pointer-events:none;animation:up 1.4s ease-out forwards;z-index:6}
@keyframes up{from{opacity:1;transform:translate(-50%,0) scale(.6)}to{opacity:0;transform:translate(-50%,-70px) scale(1.1)}}

/* 第二屏：辦公室（Cubbi），整屏、畫面要大 */
.office{min-height:100vh;background:#0e1428;color:#dfe3f3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:60px 4vw}
.office .screen{height:min(76vh,1100px);aspect-ratio:1080/1250;max-width:92vw;border-radius:26px;overflow:hidden;box-shadow:0 30px 90px #000c}
.office video{width:100%;height:100%;object-fit:cover;display:block}
.office .dev{display:flex;align-items:center;gap:14px}
.office .gh{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#fff;color:#0e1428;transition:transform .2s}
.office .gh:hover{transform:scale(1.07)}
.office .gh svg{width:36px;height:36px}
.office code{font-family:ui-monospace,Menlo,monospace;font-size:17px;background:#ffffff14;padding:12px 18px;border-radius:10px;user-select:all}
.office small{font-size:12px;opacity:.4}
/* 往下滑的提示：不寫字，底部一個會上下晃的箭頭，點了捲到第二屏 */
.down{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:#ffffffcc;display:grid;place-items:center;box-shadow:0 8px 20px #5a3a2226;z-index:30;animation:bob 1.8s ease-in-out infinite;cursor:pointer;border:0}
.down svg{width:26px;height:26px}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}

footer{padding:40px 5vw;font-size:13px;color:var(--soft);display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:space-between}
footer nav{display:flex;gap:20px}

@media(max-width:760px){
  .f1{left:5%;top:30%;width:96px}.f2{right:5%;top:27%;width:100px}.f3{display:none}
  .sign{top:8%}
}

<script>
// 三隻貓在地板上自己走、坐、躺、舔毛；點一下會翻肚子或踩奶，還會呼嚕
// 圖跟遊戲同一套（每組第 1 格是同比例站姿），所以同一隻貓所有動作用同一個縮放就不會忽大忽小
const ROOM=document.getElementById('room'), BASE='/v/20261026/cats/';
const SEQ={walk:['walk0','walk1','walk2','walk3'],sitDown:['sitA','sitB','sit2','sit3'],lieDown:['lie1','lie2','lie3'],
  groom:['groom','lick0','lick1','lick0'],knead:['knead0','knead1','knead2','knead1'],belly:['belly']};
const CATS=[{id:'calico',h:414,x:.22,depth:.55},{id:'white',h:427,x:.5,depth:.8},{id:'tabby',h:428,x:.78,depth:.35}];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const frames={};
for(const c of CATS)for(const s of Object.values(SEQ))for(const f of s){const k=c.id+'/'+f;if(!frames[k]){const im=new Image();im.src=BASE+k+'.webp';frames[k]=im}}

const W=()=>ROOM.clientWidth, H=()=>ROOM.clientHeight;
const size=()=>Math.max(96,Math.min(190,W()*.13));            // 站姿高度（px）
const rand=(a,b)=>a+Math.random()*(b-a);

for(const c of CATS){
  c.el=document.createElement('div');c.el.className='cat';
  c.img=document.createElement('img');c.img.alt='';c.el.append(c.img);
  const sh=document.createElement('div');sh.className='shadow';c.el.append(sh);
  ROOM.append(c.el);
  c.px=c.x*W();c.dir=Math.random()<.5?1:-1;c.state='idle';c.t=0;c.f=0;c.hold=rand(.5,2);
  c.purr=new Audio(BASE+'purr-'+c.id+'.m4a');c.purr.loop=true;
  c.el.addEventListener('pointerdown',e=>{e.preventDefault();pet(c)});
}
function show(c,name){
  const im=frames[c.id+'/'+name]; if(!im.complete||!im.naturalHeight)return;
  const k=size()/c.h*(.78+.32*c.depth);                         // 越靠前（depth 大）越大
  if(c.img.src!==im.src)c.img.src=im.src;
  c.img.style.height=im.naturalHeight*k+'px';
}
function place(c){
  const y=H()*.34*(1-c.depth)*.82;                               // 地板上的前後位置
  c.el.style.transform=`translate(${c.px}px,${-y-8}px) translateX(-50%) scaleX(${c.dir})`;
  c.el.style.zIndex=10+Math.round(c.depth*10);
}
function next(c){                                                // 選下一件事
  const r=Math.random();
  if(r<.5){c.state='walk';const m=size()*.9;c.goal=Math.max(m,Math.min(W()-m,c.px+rand(-1,1)*W()*.4));c.dir=c.goal>c.px?1:-1}
  else if(r<.72){c.state='sitDown';c.hold=rand(3,6)}
  else if(r<.88){c.state='groom';c.hold=rand(2.5,4.5)}
  else {c.state='lieDown';c.hold=rand(5,9)}
  c.t=0;c.f=0;
}
function pet(c){
  c.state=Math.random()<.5?'belly':'knead';c.t=0;c.f=0;c.hold=3.2;
  c.purr.currentTime=0;c.purr.volume=.7;c.purr.play().catch(()=>{});
  heart(c);
}
function heart(c){
  const r=c.el.getBoundingClientRect(),R=ROOM.getBoundingClientRect();
  const h=document.createElement('div');h.className='heart';
  h.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.5 3.3 5 6.8 5c2 0 3.5 1.1 5.2 3 1.7-1.9 3.2-3 5.2-3 3.5 0 5.8 3.5 4.4 6.8C19.5 16.4 12 21 12 21z" fill="#e8798a"/></svg>';
  h.style.left=(r.left+r.width/2-R.left)+'px';h.style.top=(r.top-R.top+10)+'px';ROOM.append(h);setTimeout(()=>h.remove(),1500);
}
let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  for(const c of CATS){
    c.t+=dt;const s=SEQ[c.state]||SEQ.sitDown;
    if(c.state==='idle'){show(c,'walk0');if(c.t>c.hold&&!reduce)next(c)}
    else if(c.state==='walk'){
      const sp=size()*.55*(.8+.3*c.depth);
      c.px+=c.dir*sp*dt;show(c,s[Math.floor(c.t*7)%4]);
      if((c.dir>0&&c.px>=c.goal)||(c.dir<0&&c.px<=c.goal)){c.state='idle';c.t=0;c.hold=rand(.6,1.6)}
    }
    else if(c.state==='sitDown'||c.state==='lieDown'){
      // 一格一格坐下／躺下 → 停住 → 倒著播站起來，不用閃的
      const n=s.length,d=n/6,up=c.t-d-c.hold;
      const i=up<0?Math.min(n-1,Math.floor(c.t*6)):n-1-Math.floor(up*6);
      if(i<0){c.state='idle';c.t=0;c.hold=rand(.4,1.2)}else show(c,s[i]);
    }
    else { show(c,s[Math.floor(c.t*5)%s.length]);
      if(c.t>c.hold){ if(c.purr&&!c.purr.paused){fade(c.purr)} c.state='idle';c.t=0;c.hold=rand(1,2.5)} }
    place(c);
  }
  requestAnimationFrame(tick);
}
function fade(a){let v=a.volume;const t=setInterval(()=>{v-=.07;if(v<=0){a.pause();clearInterval(t)}else a.volume=v},60)}
requestAnimationFrame(tick);
</script>
