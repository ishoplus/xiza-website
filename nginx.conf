server {
    listen 80;
    server_name xi-za.com www.xi-za.com;

    root /usr/share/nginx/html;
    index index.html index.htm;
    charset utf-8;
    charset_types text/plain text/css application/javascript;

    # /v/<日期>/：帶版本號的素材，換版就換資料夾，可以放心長期快取（Cloudflare 也不會給舊版）
    location ^~ /v/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML: 不快取，每次都重新驗證（確保新版部署後立即生效）
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    # CSS / JS / 圖片：允許快取，但每次都驗證 ETag（有更新才重新下載）
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
